<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="AI Queries Finder: a Claude skill that finds AI-style queries in Google Search Console with regex and builds an AI visibility plan">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070d1c"/>
      <stop offset="0.55" stop-color="#0d1730"/>
      <stop offset="1" stop-color="#101a3a"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="reflect">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#34d399"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;600 0;0 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0"/>
      <stop offset=".5" stop-color="#a78bfa" stop-opacity=".35"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="orbA"><stop offset="0" stop-color="#22d3ee" stop-opacity=".45"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <radialGradient id="orbB"><stop offset="0" stop-color="#a78bfa" stop-opacity=".40"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
    <radialGradient id="orbC"><stop offset="0" stop-color="#34d399" stop-opacity=".30"/><stop offset="1" stop-color="#34d399" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".045"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="400" rx="22"/></clipPath>
    <clipPath id="tbl"><rect x="0" y="70" width="444" height="138"/></clipPath>
  </defs>

  <style>
    .f { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .fade1 { opacity: 0; animation: fade .9s ease-out .2s forwards; }
    .fade2 { opacity: 0; animation: fade .9s ease-out .6s forwards; }
    .fade3 { opacity: 0; animation: fade .9s ease-out 1.0s forwards; }
    .fade4 { opacity: 0; animation: fade .9s ease-out 1.4s forwards; }
    @keyframes fade { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .float { animation: float 6s ease-in-out infinite; }
    .float2 { animation: float 7s ease-in-out -2s infinite; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    .typing { clip-path: inset(0 100% 0 0); animation: typing 8s steps(40) infinite; }
    @keyframes typing { 0% { clip-path: inset(0 100% 0 0); } 25%,92% { clip-path: inset(0 0 0 0); } 100% { clip-path: inset(0 100% 0 0); } }
    .scanbar { animation: scanbar 8s ease-in-out infinite; }
    @keyframes scanbar { 0%,28% { transform: translateY(-40px); opacity: 0; } 30% { opacity: 1; } 62% { transform: translateY(150px); opacity: 1; } 64%,100% { transform: translateY(150px); opacity: 0; } }
    .hit { opacity: 0; animation: hit 8s ease-out infinite; }
    @keyframes hit { 0%,34% { opacity: 0; } 40%,92% { opacity: 1; } 100% { opacity: 0; } }
    .hit2 { opacity: 0; animation: hit2 8s ease-out infinite; }
    @keyframes hit2 { 0%,44% { opacity: 0; } 50%,92% { opacity: 1; } 100% { opacity: 0; } }
    .hit3 { opacity: 0; animation: hit3 8s ease-out infinite; }
    @keyframes hit3 { 0%,54% { opacity: 0; } 60%,92% { opacity: 1; } 100% { opacity: 0; } }
    .dim { animation: dim 8s ease-in-out infinite; }
    @keyframes dim { 0%,36% { opacity: 1; } 44%,92% { opacity: .35; } 100% { opacity: 1; } }
    .draw { stroke-dasharray: 420; stroke-dashoffset: 420; animation: draw 8s ease-in-out infinite; }
    @keyframes draw { 0%,40% { stroke-dashoffset: 420; } 80%,92% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 420; } }
    .cite { opacity: 0; animation: cite 8s ease-out infinite; }
    .k2 { animation-delay: .3s; } .k3 { animation-delay: .6s; }
    @keyframes cite { 0%,62% { opacity: 0; transform: translateX(-8px); } 70%,92% { opacity: 1; transform: translateX(0); } 100% { opacity: 0; } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="400" fill="url(#bg)"/>
    <rect width="1200" height="400" fill="url(#grid)"/>

    <circle r="220" fill="url(#orbA)">
      <animate attributeName="cx" values="120;260;120" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="60;140;60" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle r="260" fill="url(#orbB)">
      <animate attributeName="cx" values="1050;900;1050" dur="16s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="360;260;360" dur="16s" repeatCount="indefinite"/>
    </circle>
    <circle r="180" fill="url(#orbC)">
      <animate attributeName="cx" values="640;720;640" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="420;330;420" dur="12s" repeatCount="indefinite"/>
    </circle>

    <!-- Left: text -->
    <g class="f">
      <g class="fade1">
        <rect x="70" y="62" width="290" height="30" rx="15" fill="#22d3ee" fill-opacity=".12" stroke="#22d3ee" stroke-opacity=".5"/>
        <circle cx="90" cy="77" r="5" fill="#34d399"><animate attributeName="opacity" values="1;.25;1" dur="1.6s" repeatCount="indefinite"/></circle>
        <text x="104" y="82" font-size="14" font-weight="600" fill="#a5f3fc" letter-spacing=".5">CLAUDE SKILL · GSC · AEO · GEO</text>
      </g>
      <text class="fade2" x="68" y="160" font-size="66" font-weight="800" fill="url(#title)" letter-spacing="-1">AI Queries</text>
      <text class="fade3" x="70" y="214" font-size="44" font-weight="700" fill="#f8fafc">Finder</text>
      <text class="fade4" x="70" y="258" font-size="19" fill="#94a3b8">Search Console  →  regex  →  AI prompts  →  visibility plan</text>

      <g class="fade4 mono" font-size="13" font-weight="600">
        <rect x="70" y="292" width="156" height="36" rx="10" fill="#0f172a" stroke="#334155"/>
        <text x="86" y="315" fill="#a78bfa">10 regexes</text><text x="174" y="315" fill="#cbd5e1">→ GSC</text>
        <rect x="236" y="292" width="170" height="36" rx="10" fill="#0f172a" stroke="#334155"/>
        <text x="252" y="315" fill="#22d3ee">Prompts</text><text x="320" y="315" fill="#cbd5e1">→ topics</text>
        <rect x="416" y="292" width="190" height="36" rx="10" fill="#0f172a" stroke="#334155"/>
        <text x="432" y="315" fill="#34d399">7/30/90</text><text x="500" y="315" fill="#cbd5e1">→ cited</text>
      </g>
    </g>

    <!-- Right: GSC performance card with a regex filter scanning queries -->
    <g class="float">
      <g transform="translate(676,48)">
        <rect width="444" height="212" rx="16" fill="#0b1324" stroke="#334155"/>
        <rect width="444" height="36" rx="16" fill="#111c33"/>
        <rect y="20" width="444" height="16" fill="#111c33"/>
        <circle cx="22" cy="18" r="6" fill="#f87171"/><circle cx="42" cy="18" r="6" fill="#fbbf24"/><circle cx="62" cy="18" r="6" fill="#34d399"/>
        <rect x="88" y="9" width="270" height="18" rx="9" fill="#1e293b"/>
        <text x="100" y="22" class="mono" font-size="11" fill="#94a3b8">search.google.com/search-console</text>

        <!-- filter chip -->
        <rect x="16" y="44" width="412" height="22" rx="11" fill="#1e1b4b" stroke="#a78bfa" stroke-opacity=".6"/>
        <text x="28" y="59" class="f" font-size="11" font-weight="700" fill="#c4b5fd">Query ~</text>
        <g class="typing"><text x="76" y="59" class="mono" font-size="10.5" fill="#e9d5ff">(?i)^\S+(\s+\S+){9,}$|^(how|what|why|can)\s|…</text></g>

        <g clip-path="url(#tbl)" class="f" font-size="11.5">
          <text x="20" y="84" font-size="10" font-weight="700" fill="#64748b">TOP QUERIES</text>
          <text x="340" y="84" font-size="10" font-weight="700" fill="#64748b">IMPR</text>
          <text x="392" y="84" font-size="10" font-weight="700" fill="#64748b">POS</text>
          <!-- rows -->
          <g class="dim"><text x="20" y="106" fill="#cbd5e1">epoxy flooring gold coast</text><text x="340" y="106" fill="#94a3b8">5,210</text><text x="392" y="106" fill="#94a3b8">2.3</text></g>
          <rect class="hit" x="12" y="114" width="420" height="20" rx="5" fill="#a78bfa" fill-opacity=".18"/>
          <text x="20" y="128" fill="#f1f5f9">how long does epoxy garage floor last</text><text x="340" y="128" fill="#e2e8f0">2,400</text><text x="392" y="128" fill="#e2e8f0">2.1</text>
          <g class="dim"><text x="20" y="150" fill="#cbd5e1">garage floor coating</text><text x="340" y="150" fill="#94a3b8">1,980</text><text x="392" y="150" fill="#94a3b8">6.4</text></g>
          <rect class="hit2" x="12" y="158" width="420" height="20" rx="5" fill="#22d3ee" fill-opacity=".16"/>
          <text x="20" y="172" fill="#f1f5f9">i have cracks in my garage floor can i still…</text><text x="340" y="172" fill="#e2e8f0">190</text><text x="392" y="172" fill="#e2e8f0">15.2</text>
          <rect class="hit3" x="12" y="180" width="420" height="20" rx="5" fill="#34d399" fill-opacity=".16"/>
          <text x="20" y="194" fill="#f1f5f9">give me a checklist for preparing a garage…</text><text x="340" y="194" fill="#e2e8f0">120</text><text x="392" y="194" fill="#e2e8f0">18.1</text>
          <rect class="scanbar" x="8" y="84" width="428" height="30" fill="url(#scan)"/>
        </g>
      </g>
    </g>

    <!-- Topics found -->
    <g class="f" transform="translate(676,272)">
      <rect width="290" height="96" rx="14" fill="#0b1324" stroke="#334155"/>
      <text x="16" y="24" font-size="12" font-weight="700" fill="#cbd5e1">Target: AI answers that cite you</text>
      <g class="cite"><rect x="16" y="36" width="8" height="16" rx="2" fill="#34d399"/><text x="32" y="49" font-size="11" fill="#e2e8f0">AI Overview · "how long does epoxy last"</text></g>
      <g class="cite k2"><rect x="16" y="58" width="8" height="16" rx="2" fill="#22d3ee"/><text x="32" y="71" font-size="11" fill="#e2e8f0">ChatGPT · "epoxy floor cost per m²"</text></g>
      <g class="cite k3"><rect x="16" y="80" width="8" height="12" rx="2" fill="#a78bfa"/><text x="32" y="90" font-size="11" fill="#e2e8f0">Perplexity · "fix cracks before epoxy"</text></g>
    </g>

    <!-- AI-style impressions climbing -->
    <g transform="translate(980,272)"><g class="float2">
      <rect width="140" height="96" rx="14" fill="#0b1324" stroke="#334155"/>
      <text x="14" y="22" class="f" font-size="11" font-weight="700" fill="#cbd5e1">AI-style clicks</text>
      <text x="14" y="86" class="mono" font-size="10" fill="#fbbf24">690</text>
      <text x="100" y="40" class="mono" font-size="10" fill="#34d399">▲</text>
      <polyline class="draw" points="30,80 52,76 70,70 88,58 104,48 120,40" fill="none" stroke="url(#line)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g></g>
  </g>
  <rect x=".5" y=".5" width="1199" height="399" rx="22" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
</svg>
